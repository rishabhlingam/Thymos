<svg viewBox="0 0 2470 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #3a414a; stroke-width: 1.5; }
    .rowline { stroke: #3a414a; stroke-width: 1; }
    .colline { stroke: #3a414a; stroke-width: 1; }
    .tablename { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .keytype { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    .fieldname { font-size: 12px; fill: #1a1a1a; }
    .typeval { font-size: 11px; fill: #55606b; }
    .conn { stroke: #3a414a; stroke-width: 1.5; fill: none; }
    .examplehead { font-size: 12px; font-weight: 700; fill: #1a1a1a; }
    .examplecell { font-size: 11px; fill: #1a1a1a; }
    .examplebox { fill: #fafafa; stroke: #9aa3ad; stroke-width: 1; }
  </style>

  <!-- ================= PROJECTS  x=20 y=122 w=535 h=70 ================= -->
  <rect x="20" y="122" width="535" height="70" rx="10" class="box"/>
  <line x1="20" y1="158" x2="555" y2="158" class="rowline"/>
  <text x="287" y="145" text-anchor="middle" class="tablename">PROJECTS</text>
  <line x1="65" y1="158" x2="65" y2="192" class="colline"/>
  <line x1="260" y1="158" x2="260" y2="192" class="colline"/>
  <text x="32" y="180" class="keytype">PK</text>
  <text x="75" y="180" class="fieldname">project_id</text>
  <text x="270" y="180" class="typeval">text</text>

  <!-- ================= SUBJECTS  x=645 y=20 w=535 h=274 ================= -->
  <rect x="645" y="20" width="535" height="274" rx="10" class="box"/>
  <line x1="645" y1="56" x2="1180" y2="56" class="rowline"/>
  <text x="912" y="43" text-anchor="middle" class="tablename">SUBJECTS</text>
  <line x1="690" y1="56" x2="690" y2="294" class="colline"/>
  <line x1="885" y1="56" x2="885" y2="294" class="colline"/>

  <line x1="645" y1="90" x2="1180" y2="90" class="rowline"/>
  <text x="657" y="78" class="keytype">PK</text>
  <text x="700" y="78" class="fieldname">subject_id</text>
  <text x="895" y="78" class="typeval">text</text>

  <line x1="645" y1="124" x2="1180" y2="124" class="rowline"/>
  <text x="657" y="112" class="keytype">FK</text>
  <text x="700" y="112" class="fieldname">project_id</text>
  <text x="895" y="112" class="typeval">text</text>

  <line x1="645" y1="158" x2="1180" y2="158" class="rowline"/>
  <text x="700" y="146" class="fieldname">condition</text>
  <text x="895" y="146" class="typeval">text (melanoma, carcinoma, healthy)</text>

  <line x1="645" y1="192" x2="1180" y2="192" class="rowline"/>
  <text x="700" y="180" class="fieldname">age</text>
  <text x="895" y="180" class="typeval">integer</text>

  <line x1="645" y1="226" x2="1180" y2="226" class="rowline"/>
  <text x="700" y="214" class="fieldname">sex</text>
  <text x="895" y="214" class="typeval">text (M, F)</text>

  <line x1="645" y1="260" x2="1180" y2="260" class="rowline"/>
  <text x="700" y="248" class="fieldname">treatment</text>
  <text x="895" y="248" class="typeval">text (miraclib, phauximab, none)</text>

  <text x="700" y="282" class="fieldname">response</text>
  <text x="895" y="282" class="typeval">text (yes, no), nullable</text>

  <!-- ================= SAMPLES  x=1270 y=71 w=535 h=172 ================= -->
  <rect x="1270" y="71" width="535" height="172" rx="10" class="box"/>
  <line x1="1270" y1="107" x2="1805" y2="107" class="rowline"/>
  <text x="1537" y="94" text-anchor="middle" class="tablename">SAMPLES</text>
  <line x1="1315" y1="107" x2="1315" y2="243" class="colline"/>
  <line x1="1510" y1="107" x2="1510" y2="243" class="colline"/>

  <line x1="1270" y1="141" x2="1805" y2="141" class="rowline"/>
  <text x="1282" y="129" class="keytype">PK</text>
  <text x="1325" y="129" class="fieldname">sample_id</text>
  <text x="1520" y="129" class="typeval">text</text>

  <line x1="1270" y1="175" x2="1805" y2="175" class="rowline"/>
  <text x="1282" y="163" class="keytype">FK</text>
  <text x="1325" y="163" class="fieldname">subject_id</text>
  <text x="1520" y="163" class="typeval">text</text>

  <line x1="1270" y1="209" x2="1805" y2="209" class="rowline"/>
  <text x="1325" y="197" class="fieldname">sample_type</text>
  <text x="1520" y="197" class="typeval">text (PBMC, WB)</text>

  <text x="1325" y="231" class="fieldname">time_from_treatment_start</text>
  <text x="1520" y="231" class="typeval">integer (0, 7, 14)</text>

  <!-- ================= CELL_COUNTS  x=1895 y=63 w=535 h=188 ================= -->
  <rect x="1895" y="63" width="535" height="188" rx="10" class="box"/>
  <line x1="1895" y1="99" x2="2430" y2="99" class="rowline"/>
  <text x="2162" y="86" text-anchor="middle" class="tablename">CELL_COUNTS</text>
  <line x1="1940" y1="99" x2="1940" y2="251" class="colline"/>
  <line x1="2135" y1="99" x2="2135" y2="251" class="colline"/>

  <line x1="1895" y1="133" x2="2430" y2="133" class="rowline"/>
  <text x="1907" y="121" class="keytype">PK</text>
  <text x="1950" y="121" class="fieldname">id</text>
  <text x="2145" y="121" class="typeval">integer, autoincrement</text>

  <line x1="1895" y1="167" x2="2430" y2="167" class="rowline"/>
  <text x="1907" y="155" class="keytype">FK</text>
  <text x="1950" y="155" class="fieldname">sample_id</text>
  <text x="2145" y="155" class="typeval">text</text>

  <line x1="1895" y1="217" x2="2430" y2="217" class="rowline"/>
  <text x="1950" y="187" class="fieldname">population</text>
  <text x="2145" y="187" class="typeval">text (b_cell, cd4_t_cell, cd8_t_cell,</text>
  <text x="2145" y="205" class="typeval">monocyte, nk_cell)</text>

  <text x="1950" y="239" class="fieldname">count</text>
  <text x="2145" y="239" class="typeval">integer</text>

  <!-- ================= CONNECTORS ================= -->
  <path d="M 555 175 L 600 175 L 600 107 L 645 107" class="conn"/>
  <line x1="565" y1="168" x2="565" y2="182" class="conn"/>
  <path d="M 635 100 L 645 107 L 635 114" class="conn"/>

  <path d="M 1180 73 L 1225 73 L 1225 158 L 1270 158" class="conn"/>
  <line x1="1190" y1="66" x2="1190" y2="80" class="conn"/>
  <path d="M 1260 151 L 1270 158 L 1260 165" class="conn"/>

  <path d="M 1805 124 L 1850 124 L 1850 150 L 1895 150" class="conn"/>
  <line x1="1815" y1="117" x2="1815" y2="131" class="conn"/>
  <path d="M 1885 143 L 1895 150 L 1885 157" class="conn"/>

  <!-- ================= LEGEND ================= -->
  <text x="20" y="325" font-size="12" fill="#1a1a1a" font-weight="700">Reading the connectors</text>
  <line x1="20" y1="337" x2="45" y2="337" class="conn"/>
  <line x1="30" y1="332" x2="30" y2="342" class="conn"/>
  <text x="52" y="341" font-size="11" fill="#1a1a1a">one, the referenced primary key side</text>
  <path d="M 340 332 L 330 337 L 340 342" class="conn"/>
  <text x="348" y="341" font-size="11" fill="#1a1a1a">many, the foreign key side</text>

  <!-- ================= EXAMPLE DATA CALLOUT ================= -->
  <text x="1895" y="300" class="examplehead">One real sample, shown as actual rows in CELL_COUNTS</text>

  <rect x="1895" y="310" width="535" height="150" class="examplebox"/>
  <line x1="1895" y1="335" x2="2430" y2="335" stroke="#9aa3ad" stroke-width="1"/>
  <line x1="2075" y1="310" x2="2075" y2="460" stroke="#9aa3ad" stroke-width="1"/>
  <line x1="2255" y1="310" x2="2255" y2="460" stroke="#9aa3ad" stroke-width="1"/>

  <text x="1905" y="328" class="examplehead">sample</text>
  <text x="2085" y="328" class="examplehead">population</text>
  <text x="2265" y="328" class="examplehead">count</text>

  <text x="1905" y="352" class="examplecell">sample00000</text>
  <text x="2085" y="352" class="examplecell">b_cell</text>
  <text x="2265" y="352" class="examplecell">10908</text>
  <line x1="1895" y1="360" x2="2430" y2="360" stroke="#9aa3ad" stroke-width="1"/>

  <text x="1905" y="376" class="examplecell">sample00000</text>
  <text x="2085" y="376" class="examplecell">cd4_t_cell</text>
  <text x="2265" y="376" class="examplecell">20491</text>
  <line x1="1895" y1="384" x2="2430" y2="384" stroke="#9aa3ad" stroke-width="1"/>

  <text x="1905" y="400" class="examplecell">sample00000</text>
  <text x="2085" y="400" class="examplecell">cd8_t_cell</text>
  <text x="2265" y="400" class="examplecell">24440</text>
  <line x1="1895" y1="408" x2="2430" y2="408" stroke="#9aa3ad" stroke-width="1"/>

  <text x="1905" y="424" class="examplecell">sample00000</text>
  <text x="2085" y="424" class="examplecell">monocyte</text>
  <text x="2265" y="424" class="examplecell">23511</text>
  <line x1="1895" y1="432" x2="2430" y2="432" stroke="#9aa3ad" stroke-width="1"/>

  <text x="1905" y="448" class="examplecell">sample00000</text>
  <text x="2085" y="448" class="examplecell">nk_cell</text>
  <text x="2265" y="448" class="examplecell">13864</text>

  <rect x="1895" y="310" width="535" height="150" fill="none" stroke="#9aa3ad" stroke-width="1"/>

  <text x="1895" y="475" font-size="11" fill="#55606b">One sample becomes five rows here, one per population, same sample_id repeated each time.</text>
</svg>
